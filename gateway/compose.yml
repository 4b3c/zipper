# A machine's Discord gateway (gateway/): every zipper on the machine reaches Discord
# through it. `./zipper discord connect` writes this folder and starts it; by hand:
#
#   docker network create zipper-gateway
#   mkdir -p <zippers' folder>/gateway && cp this file there
#   .env beside it, mode 600:   DISCORD_TOKEN=<the bot's token>
#   docker compose up -d
#
# Invite codes (building zippers for other people) also need hostd:
#   hostd config: "zippers": {"zipper-gateway": {"tiers": ["provision"]}}, then
#   `zipper hostd install` (as root) so its socket exists. Without it, only pairing
#   codes work, and the socket mount below is an empty folder.
#
# No port is published: zippers reach it as http://zipper-gateway:4300 on the
# zipper-gateway network, and nothing else can.
services:
  gateway:
    image: zipper:local
    container_name: zipper-gateway
    hostname: zipper-gateway
    restart: unless-stopped
    working_dir: /opt/zipper-seed
    entrypoint: ["python3", "-m", "gateway", "serve"]
    env_file: [./.env]
    environment:
      GATEWAY_STATE: /zipper/gateway/registry.json
      GATEWAY_HOST_SOCKET: /run/zipper-host/hostd.sock
    volumes:
      - ./state:/zipper/gateway
      # Only the gateway's own hostd socket: it can redeem invites and nothing else.
      - /run/zipper-hostd/zipper-gateway:/run/zipper-host
    mem_limit: 256m
    networks: [zipper-gateway]

networks:
  zipper-gateway:
    external: true
